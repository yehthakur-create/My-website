<!DOCTYPE html>
<html>

<head>
    <title>My NEET Habit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <p class="tag">✨ NEET 2027 JOURNEY</p>

        <h1>
            One day closer<br>
            to the dream 🌷
        </h1>

        <p class="subtitle">
            Small steps every day. Big results someday.
        </p>


        <div class="habit-box">

            <div class="habit">
                <span>📚 Study Biology</span>
                <input type="checkbox" class="habit-check">
            </div>


            <div class="habit">
                <span>⚛️ Study Physics</span>
                <input type="checkbox" class="habit-check">
            </div>


            <div class="habit">
                <span>🧪 Study Chemistry</span>
                <input type="checkbox" class="habit-check">
            </div>


            <div class="habit">
                <span>📝 Practice Questions</span>
                <input type="checkbox" class="habit-check">
            </div>


            <div class="habit">
                <span>📵 No Phone Distraction</span>
                <input type="checkbox" class="habit-check">
            </div>


            <div class="habit">
                <span>😴 Sleep on Time</span>
                <input type="checkbox" class="habit-check">
            </div>

        </div>


        <p class="footer">
            Made with discipline, dreams & coffee ☕
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
